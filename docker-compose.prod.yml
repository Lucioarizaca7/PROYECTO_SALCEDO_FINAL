# Despliegue de SISREC en un servidor (VPS) con 4 contenedores.
# Solo "web" (Caddy) publica puertos; la base de datos y la analítica quedan en la red interna.
#
#   cp .env.production.example .env.production   # y completar los valores
#   docker compose --env-file .env.production -f docker-compose.prod.yml up -d --build
#   docker compose --env-file .env.production -f docker-compose.prod.yml exec api node dist/cli/crear-admin.js
#
# Guía completa: docs/despliegue-produccion.md

name: sisrec

# Logs con rotación: como máximo 5 archivos de 10 MB por contenedor (no llenan el disco).
x-logs: &logs
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    <<: *logs
    environment:
      POSTGRES_DB: sisrec
      POSTGRES_USER: sisrec
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD en .env.production}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sisrec -d sisrec"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [interna]

  api:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    restart: unless-stopped
    <<: *logs
    env_file: .env.production
    environment:
      NODE_ENV: production
      PORT: 3003
      DATABASE_URL: postgresql://sisrec:${POSTGRES_PASSWORD}@postgres:5432/sisrec
      FRONTEND_URL: https://${DOMAIN:?Defina DOMAIN en .env.production}
      TRUST_PROXY: 1
      # Proyección de recaudación; si la analítica no responde, la API usa su respaldo local.
      ANALYTICS_URL: http://analytics:8001
    depends_on:
      postgres:
        condition: service_healthy
    networks: [interna]

  analytics:
    build: apps/analytics
    restart: unless-stopped
    <<: *logs
    networks: [interna]

  # Respaldo diario de la base (02:00 de Lima) con 30 días de retención; opcionalmente a un bucket S3.
  # Prueba manual:        docker compose … run --rm backup ahora
  # Restauración prueba:  docker compose … run --rm backup sh /scripts/restaurar-respaldo.sh
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    <<: *logs
    entrypoint: ["sh", "/scripts/respaldo.sh"]
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_RETENCION_DIAS: ${BACKUP_RETENCION_DIAS:-30}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      BACKUP_S3_ACCESS_KEY: ${BACKUP_S3_ACCESS_KEY:-}
      BACKUP_S3_SECRET_KEY: ${BACKUP_S3_SECRET_KEY:-}
    volumes:
      - respaldos:/respaldos
      - ./deploy/backup:/scripts:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks: [interna]

  web:
    build:
      context: .
      dockerfile: apps/client/Dockerfile
      args:
        VITE_API_URL: https://${DOMAIN}
    restart: unless-stopped
    <<: *logs
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api]
    networks: [interna]

volumes:
  pgdata:
  respaldos:
  caddy_data:
  caddy_config:

networks:
  interna:
