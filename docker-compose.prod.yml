# Despliegue de SISREC en un servidor (VPS) con 4 contenedores.
# Solo "web" (Caddy) publica puertos; la base de datos y la analítica quedan en la red interna.
#
#   cp .env.production.example .env.production   # y completar los valores
#   docker compose --env-file .env.production -f docker-compose.prod.yml up -d --build
#   docker compose --env-file .env.production -f docker-compose.prod.yml exec api node dist/cli/crear-admin.js

name: sisrec

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sisrec
      POSTGRES_USER: sisrec
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD en .env.production}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sisrec -d sisrec"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [interna]

  api:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    restart: unless-stopped
    env_file: .env.production
    environment:
      NODE_ENV: production
      PORT: 3003
      DATABASE_URL: postgresql://sisrec:${POSTGRES_PASSWORD}@postgres:5432/sisrec
      FRONTEND_URL: https://${DOMAIN:?Defina DOMAIN en .env.production}
      TRUST_PROXY: 1
    depends_on:
      postgres:
        condition: service_healthy
    networks: [interna]

  analytics:
    build: apps/analytics
    restart: unless-stopped
    networks: [interna]

  web:
    build:
      context: .
      dockerfile: apps/client/Dockerfile
      args:
        VITE_API_URL: https://${DOMAIN}
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api]
    networks: [interna]

volumes:
  pgdata:
  caddy_data:
  caddy_config:

networks:
  interna:
